name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --release

  scenario-tests:
    name: Scenario Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      httpbin:
        image: kennethreitz/httpbin
        ports:
          - 8080:80
      # 1.6 allows anonymous connections by default (2.x requires a config file)
      mosquitto:
        image: eclipse-mosquitto:1.6
        ports:
          - 1883:1883
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
      ws-echo:
        image: jmalloc/echo-server
        ports:
          - 8090:8080
      grpcbin:
        image: moul/grpcbin
        ports:
          - 9000:9000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Fusillade
        run: cargo build --release

      - name: Run scenario tests
        env:
          # Local service containers keep these hermetic (no external services)
          FUSILLADE_BASE_URL: http://localhost:8080
          FUSILLADE_MQTT_HOST: localhost
          FUSILLADE_MQTT_PORT: "1883"
          FUSILLADE_AMQP_URL: amqp://guest:guest@localhost:5672
          FUSILLADE_WS_URL: ws://localhost:8090
          FUSILLADE_SSE_URL: http://localhost:8090/.sse
          FUSILLADE_GRPC_URL: http://localhost:9000
        run: |
          # Unit tests (no HTTP required)
          ./target/release/fusillade run scenarios/unit_test.js --headless
          ./target/release/fusillade run scenarios/utils_test.js --headless
          ./target/release/fusillade run scenarios/group_test.js --headless
          ./target/release/fusillade run scenarios/data_test.js --headless

          # Config and lifecycle tests
          ./target/release/fusillade run scenarios/config_test.js --headless
          ./target/release/fusillade run scenarios/iterations_test.js --headless
          ./target/release/fusillade run scenarios/lifecycle-test.js --headless

          # HTTP tests (local httpbin service)
          ./target/release/fusillade run scenarios/check_test.js --headless
          ./target/release/fusillade run scenarios/http_test.js --headless
          ./target/release/fusillade run scenarios/timeout_test.js --headless

          # Protocol tests (local broker service containers; these scenarios
          # gate on a success-rate threshold and exit non-zero on failure)
          ./target/release/fusillade run scenarios/ws_test.js --headless
          ./target/release/fusillade run scenarios/mqtt_test.js --headless
          ./target/release/fusillade run scenarios/amqp_test.js --headless
          ./target/release/fusillade run scenarios/sse_test.js --headless
          ./target/release/fusillade run scenarios/grpc_test.js --headless

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --release -- -D warnings
